name: Release GetTube

on:
  push:
    tags: [ 'build-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (universal + per-ABI)
        run: |
          chmod +x gradlew
          ./gradlew assembleGenericRelease --no-daemon --stacktrace

      - name: Collect and rename APKs (one file per ABI)
        run: |
          mkdir -p dist
          find app/build/outputs -type f -name '*.apk' | tee /tmp/apks.txt
          while read -r f; do
            low=$(basename "$f" | tr 'A-Z' 'a-z')
            base=$(basename "$f")
            case "$low" in
              *arm64-v8a*)    cp "$f" "dist/GetTube-arm64-r${GITHUB_RUN_NUMBER}.apk" ;;
              *armeabi-v7a*)  cp "$f" "dist/GetTube-arm32-r${GITHUB_RUN_NUMBER}.apk" ;;
              *x86_64*)       cp "$f" "dist/GetTube-x86_64-r${GITHUB_RUN_NUMBER}.apk" ;;
              *x86*)          cp "$f" "dist/GetTube-x86-r${GITHUB_RUN_NUMBER}.apk" ;;
              *universal*)    echo "skip universal ($base) — per-ABI export only" ;;
              *) echo "skip $base" ;;
            esac
          done < /tmp/apks.txt
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: GetTube ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          files: dist/*.apk
          body: |
            🚀 **GetTube ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}** — محرك yt-dlp كامل (مبني على Seal)

            📦 **كل معمارية في ملف منفصل** — اختار الملف المناسب لجهازك:
            - `GetTube-arm64-r*.apk` — الموبايلات الحديثة (الأغلبية — موصى به) ✅
            - `GetTube-arm32-r*.apk` — الموبايلات والأجهزة القديمة (معالج 32-bit)
            - `GetTube-x86_64-r*.apk` — المحاكيات وأجهزة Intel 64-bit
            - `GetTube-x86-r*.apk` — أجهزة Intel 32-bit نادرة

            - كل ملف حجمه ~40MB بدل ملف واحد كبير — توفير في التنزيل واستهلاك النت
            - جودات من 144p حتى 8K + تحويل MP3 + تحميل قوائم التشغيل كاملة
            - محرك yt-dlp يتحدث باستمرار لتجاوز حجب يوتيوب — ويمكن تحديثه من داخل التطبيق (الإعدادات ← yt-dlp)

            > حمّل ملف APK واحد فقط من قسم Assets تحت 👇
          make_latest: true

      - name: Upload artifact (7 days retention)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GetTube-APKs
          path: dist/*.apk
          retention-days: 7
