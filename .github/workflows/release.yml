name: Release GetTube

on:
  push:
    tags: [ 'build-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (universal + per-ABI)
        run: |
          chmod +x gradlew
          ./gradlew buildGenericRelease --no-daemon --stacktrace

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          OUT=app/build/outputs/apk/generic/release
          ls -la "$OUT"
          for f in "$OUT"/*.apk; do
            low=$(basename "$f" | tr 'A-Z' 'a-z')
            base=$(basename "$f")
            case "$low" in
              *universal*)    cp "$f" "dist/GetTube-universal-r${GITHUB_RUN_NUMBER}.apk" ;;
              *arm64-v8a*)    cp "$f" "dist/GetTube-arm64-r${GITHUB_RUN_NUMBER}.apk" ;;
              *armeabi-v7a*)  cp "$f" "dist/GetTube-arm32-r${GITHUB_RUN_NUMBER}.apk" ;;
              *) echo "skip $base" ;;
            esac
          done
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: GetTube build ${{ github.run_number }}
          files: dist/*.apk
          body: |
            🚀 **GetTube build ${{ github.run_number }}** — محرك yt-dlp كامل (مبني على Seal)

            - الملف الموصى به: `GetTube-universal-r*.apk` — يعمل على أي جهاز
            - أو `GetTube-arm64-r*.apk` للموبايلات الحديثة (أصغر حجماً)
            - جودات من 144p حتى 8K + تحويل MP3 + تحميل قوائم التشغيل كاملة
            - محرك yt-dlp يتحدث باستمرار لتجاوز حجب يوتيوب — ويمكن تحديثه من داخل التطبيق (الإعدادات ← yt-dlp)

            > حمّل ملف APK من قسم Assets تحت 👇
          make_latest: true

      - name: Upload artifact (7 days retention)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GetTube-APKs
          path: dist/*.apk
          retention-days: 7
